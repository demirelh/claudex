# =============================================================================
# NetworkPolicy — Restrict egress to GitHub only
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ai-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow internal namespace communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: ai-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
    # DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# LiteLLM proxy: allow egress to GitHub APIs (HTTPS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-egress-github
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: litellm-proxy
  policyTypes:
    - Egress
  egress:
    # GitHub Models API + GitHub API (HTTPS)
    # Note: In production, resolve IPs of models.github.ai and api.github.com
    # and use ipBlock instead for tighter control.
    - ports:
        - protocol: TCP
          port: 443
---
# LiteLLM proxy: allow ingress from internal clients
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-ingress
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: litellm-proxy
  policyTypes:
    - Ingress
  ingress:
    # From ingress controller namespace (adjust label to match your setup)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
    # From within namespace (health checks, etc.)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4000
