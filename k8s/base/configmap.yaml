apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
data:
  config.yaml: |
    model_list:
      - model_name: "claude-sonnet-4-20250514"
        litellm_params:
          model: "openai/anthropic/claude-4-sonnet"
          api_key: "os.environ/GITHUB_MODELS_PAT"
          api_base: "https://models.github.ai/inference"

      - model_name: "claude-sonnet"
        litellm_params:
          model: "openai/anthropic/claude-4-sonnet"
          api_key: "os.environ/GITHUB_MODELS_PAT"
          api_base: "https://models.github.ai/inference"

      - model_name: "claude-haiku"
        litellm_params:
          model: "openai/anthropic/claude-3.5-haiku"
          api_key: "os.environ/GITHUB_MODELS_PAT"
          api_base: "https://models.github.ai/inference"

      - model_name: "gpt-4.1"
        litellm_params:
          model: "openai/openai/gpt-4.1"
          api_key: "os.environ/GITHUB_MODELS_PAT"
          api_base: "https://models.github.ai/inference"

      - model_name: "gpt-4.1-mini"
        litellm_params:
          model: "openai/openai/gpt-4.1-mini"
          api_key: "os.environ/GITHUB_MODELS_PAT"
          api_base: "https://models.github.ai/inference"

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 120
      cache: true
      cache_params:
        type: redis
        host: "os.environ/REDIS_HOST"
        port: "os.environ/REDIS_PORT"
        ttl: 3600

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: "os.environ/DATABASE_URL"

    guardrails:
      - guardrail_name: "pii-masking"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          api_base: "http://presidio-analyzer:5001"
        pii_entities_config:
          CREDIT_CARD: "MASK"
          EMAIL_ADDRESS: "MASK"
          PHONE_NUMBER: "MASK"
          IBAN_CODE: "MASK"
        presidio_ad_hoc_recognizers:
          - name: "github_pat_recognizer"
            supported_language: "en"
            patterns:
              - name: "github_pat"
                regex: "gh[ps]_[A-Za-z0-9_]{36,}"
                score: 0.95
        presidio_filter_scope: "both"
