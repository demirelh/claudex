apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: claudex
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: claudex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          env:
            - name: GITHUB_MODELS_PAT
              valueFrom:
                secretKeyRef:
                  name: claudex-secrets
                  key: GITHUB_MODELS_PAT
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: claudex-secrets
                  key: LITELLM_MASTER_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claudex-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false  # LiteLLM needs tmp writes
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: claudex
  labels:
    app: litellm-proxy
spec:
  selector:
    app: litellm-proxy
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
