# =============================================================================
# LiteLLM Settings
# =============================================================================
litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120
  cache: true
  cache_params:
    type: redis
    host: "os.environ/REDIS_HOST"
    port: "os.environ/REDIS_PORT"
    ttl: 3600

# =============================================================================
# General / Admin Settings
# =============================================================================
general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"

  # Alerting (uncomment when Slack webhook is available)
  # alerting:
  #   - slack
  # alerting_args:
  #   slack_webhook_url: "os.environ/SLACK_WEBHOOK_URL"
  #   budget_alerts: true

# =============================================================================
# Guardrails — PII Masking via Presidio
# =============================================================================
guardrails:
  - guardrail_name: "pii-masking"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      api_base: "os.environ/PRESIDIO_ANALYZER_URL"
    pii_entities_config:
      CREDIT_CARD: "MASK"
      EMAIL_ADDRESS: "MASK"
      PHONE_NUMBER: "MASK"
      US_SSN: "MASK"
      IBAN_CODE: "MASK"
      IP_ADDRESS: "MASK"
    presidio_ad_hoc_recognizers:
      - name: "github_pat_recognizer"
        supported_language: "en"
        patterns:
          - name: "github_pat_fine_grained"
            regex: "github_pat_[A-Za-z0-9_]{82}"
            score: 0.95
          - name: "github_pat_classic"
            regex: "ghp_[A-Za-z0-9]{36}"
            score: 0.95
          - name: "generic_secret_key"
            regex: "(?i)(sk-|api[_-]?key|secret[_-]?key|token)[\\s=:\"']+[A-Za-z0-9\\-_]{20,}"
            score: 0.85
    presidio_filter_scope: "both"
