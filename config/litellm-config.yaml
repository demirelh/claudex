# =============================================================================
# LiteLLM Proxy Configuration — GitHub Models Gateway
# =============================================================================
# Routes requests through LiteLLM to GitHub Models Inference API,
# enabling GitHub-based billing.
#
# NOTE: Claude/Anthropic models are NOT available on GitHub Models as of
# 2026-02-15. If Anthropic adds models later, uncomment the Claude section.
# For now, use OpenAI, Meta, DeepSeek, Mistral, xAI models.
# =============================================================================

model_list:
